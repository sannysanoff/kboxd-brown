# A second, independent kbox pod used only for defect investigation.
#
# It runs the same unprivileged configuration as deploy/three-suites/kbox.yaml
# with the daemon in verbose mode, so a syscall trace can be read while the
# long suites keep running in the main pod. Two containers in one daemon
# contend for that daemon's network bridge, so investigation work gets its own
# daemon rather than sharing the main one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbox-probe
  namespace: kbox-three-suites
  labels:
    app: kbox-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kbox-probe
  template:
    metadata:
      labels:
        app: kbox-probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kboxd
          image: kbox-python/kbox:v201
          imagePullPolicy: IfNotPresent
          args:
            - exec /usr/local/bin/kbox daemon --sock /run/kbox/kboxd.sock --config /etc/kbox/kbox-config.yaml --cmdline "mem=4096M loglevel=4" 2>>/data/kboxd.log
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: Unconfined
          env:
            - name: HOME
              value: /dev/shm
            # No trace knobs here on purpose. The trace calls make the
            # supervisor slower, and several faults in this report (item 31)
            # only appear on a daemon that is not tracing: a fault that
            # vanishes under KBOX_TRACE=1 is a timing window, and the probe
            # must show it.
          volumeMounts:
            - name: config
              mountPath: /etc/kbox
              readOnly: true
            - name: state
              mountPath: /dev/shm
            - name: data
              mountPath: /data
            - name: run
              mountPath: /run/kbox
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 12Gi
        - name: shim
          image: kbox-python/kbox:v201
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /dev/shm
          command:
            - /usr/bin/python3
            - /usr/local/bin/kbox-dockerd.py
            - --kbox-sock
            - /run/kbox/kboxd.sock
            - --config
            - /etc/kbox/kbox-config.yaml
            - --listen
            - 0.0.0.0:2376
            - --state-dir
            - /data/kbox-dockerd
            - -v
          ports:
            - name: docker-api
              containerPort: 2376
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/kbox
              readOnly: true
            - name: state
              mountPath: /dev/shm
            - name: run
              mountPath: /run/kbox
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: kbox-config
        - name: state
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: data
          emptyDir:
            sizeLimit: 24Gi
        - name: run
          emptyDir: {}
